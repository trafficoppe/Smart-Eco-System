<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ดสรุปปริมาณขยะ</title>
  <link rel="stylesheet" href="dashboard-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- ปุ่มกลับ -->
    <a href="index.html" class="back-btn">กลับหน้าบันทึกข้อมูล</a>

    <!-- ส่วนหัว -->
    <div class="dash-header">
      <h1>แดชบอร์ดสรุปผลการจัดเก็บ</h1>
      <p>ชุดขยะครบวงจร | กองกายภาพและสิ่งแวดล้อม</p>
    </div>

    <div id="loading" class="loading-state">กำลังโหลดข้อมูล...</div>
    
    <div id="dashboard-content" style="display: none;">
      
      <!-- แถบตัวกรอง -->
      <div class="filter-section">
        <select id="filter-year">
          <option value="all">ทุกปี (รวมทั้งหมด)</option>
        </select>
        <select id="filter-dept">
          <option value="all">ทุกคณะ/ส่วนงาน (รวมทั้งหมด)</option>
        </select>
        
        <select id="filter-point">
          <option value="all">ทุกกลุ่ม (รวมทั้งหมด)</option>
        </select>
      </div>

      <!-- การ์ดสรุปข้อมูล (แทนตารางสรุป) -->
      <div class="summary-grid">
        <div class="stat-card total-card">
          <div class="stat-title">ปริมาณรวมทั้งหมด</div>
          <div class="stat-value" id="totalWasteText">0.00 <span class="unit">กก.</span></div>
        </div>
        <div class="stat-card success-card">
          <div class="stat-title">หมุนเวียน/รีไซเคิลได้</div>
          <div class="stat-value" id="divertedText">0.00 <span class="unit">กก.</span></div>
          <div class="stat-percent" id="divertedPercent">0.00%</div>
        </div>
        <div class="stat-card danger-card">
          <div class="stat-title">ฝังกลบ/รีไซเคิลไม่ได้</div>
          <div class="stat-value" id="landfillText">0.00 <span class="unit">กก.</span></div>
          <div class="stat-percent" id="landfillPercent">0.00%</div>
        </div>
      </div>

      <!-- กราฟวงกลม -->
      <div class="chart-card">
        <h3 class="chart-title">สัดส่วนประเภทขยะ (%)</h3>
        <div class="chart-container">
          <canvas id="wastePieChart"></canvas>
        </div>
      </div>

      <!-- กราฟแท่ง (แทนตารางรายละเอียด) -->
      <div class="chart-card">
        <h3 class="chart-title">ปริมาณขยะแต่ละประเภท (กก.)</h3>
        <div class="chart-container bar-container">
          <canvas id="wasteBarChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="dashboard-script.js"></script>
</body>
</html>

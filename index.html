<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบบันทึกส่งปริมาณขยะกิจกรรม | กองกายภาพและสิ่งแวดล้อม</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header class="header-card">
      <img src="1.png" alt="โลโก้กองกายภาพและสิ่งแวดล้อม" class="header-banner">
      <h1 class="main-title">บันทึกปริมาณขยะกิจกรรม</h1>
      <a href="dashboard.html" class="dashboard-btn" target="_blank">📊 ดูแดชบอร์ดสรุปผล</a>
    </header>

    <form id="wasteForm" novalidate>
      
      <!-- ส่วนที่ 1: ข้อมูลผู้บันทึกและหน่วยงาน -->
      <section class="form-section">
        <h2>ข้อมูลผู้บันทึกและหน่วยงาน</h2>

        <div class="form-group">
          <label for="email">อีเมลมหาวิทยาลัยมหิดล <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="ตัวอย่าง: example@mahidol.ac.th" required>
          <small class="error-text" id="emailError"></small>
        </div>
        
        <div class="form-group">
          <label for="recordDate">วันที่จัดเก็บข้อมูล <span class="req">*</span></label>
          <input type="date" id="recordDate" name="recordDate" required>
        </div>

        <div class="form-group">
          <label for="fullName">ชื่อ-นามสกุล <span class="req">*</span></label>
          <input type="text" id="fullName" name="fullName" placeholder="ตัวอย่าง: สมชาย ใจดี" required>
        </div>

        <div class="form-group autocomplete">
          <label for="departmentInput">คณะ / ส่วนงาน / ศูนย์ / สถาบัน <span class="req">*</span></label>
          <input type="text" id="departmentInput" name="departmentInput" placeholder="พิมพ์ชื่อเต็ม หรือตัวย่อ" autocomplete="off" required>
        </div>

        <!-- ย้ายหมายเลขจุดเก็บมาไว้ตรงนี้แทนชื่อกลุ่ม -->
        <div class="form-group">
          <label for="pointInput">หมายเลขจุดเก็บ <span class="req">*</span></label>
          <!-- เปลี่ยนจาก type="number" เป็น text แล้วบังคับด้วย pattern/maxlength -->
          <input type="text" id="pointInput" name="pointInput" placeholder="ตัวอย่าง: 1, 2, 3" 
                 maxlength="1" 
                 pattern="[0-9]" 
                 inputmode="numeric" 
                 required>
          <small style="display:block; color:#666; margin-top:4px; font-size:13px;">กรอกตัวเลขได้ 1 ตัวเท่านั้น (0-9)</small>
        </div>
      </section>

      <section class="form-section">
        <h2>ขยะรีไซเคิล</h2>
        <div class="form-group"><label>ขวดน้ำพลาสติก</label><input type="number" step="0.01" min="0" name="recycle_bottle" placeholder="0.00"></div>
        <div class="form-group"><label>ขวดแก้ว</label><input type="number" step="0.01" min="0" name="recycle_glass" placeholder="0.00"></div>
        <div class="form-group"><label>กระป๋อง</label><input type="number" step="0.01" min="0" name="recycle_can" placeholder="0.00"></div>
        <div class="form-group"><label>หลอดพลาสติก</label><input type="number" step="0.01" min="0" name="recycle_straw" placeholder="0.00"></div>
        <div class="form-group" style="margin-bottom: 0;"><label>ฝาขวด</label><input type="number" step="0.01" min="0" name="recycle_cap" placeholder="0.00"></div>
      </section>

      <section class="form-section">
        <h2>ขยะพลังงาน</h2>
        <div class="form-group"><label>ภาชนะพลาสติก</label><input type="number" step="0.01" min="0" name="energy_plastic" placeholder="0.00"></div>
        <div class="form-group"><label>ไม้เสียบลูกชิ้น/ไม้ต่างๆ</label><input type="number" step="0.01" min="0" name="energy_stick" placeholder="0.00"></div>
        <div class="form-group" style="margin-bottom: 0;"><label>ช้อนส้อมพลาสติก</label><input type="number" step="0.01" min="0" name="energy_spoon" placeholder="0.00"></div>
      </section>

      <section class="form-section">
        <h2>ขยะทำปุ๋ย</h2>
        <div class="form-group"><label>ภาชนะเยื่อพืช</label><input type="number" step="0.01" min="0" name="compost_plant" placeholder="0.00"></div>
        <div class="form-group" style="margin-bottom: 0;"><label>เศษอาหาร</label><input type="number" step="0.01" min="0" name="compost_food" placeholder="0.00"></div>
      </section>

      <section class="form-section">
        <h2>ขยะประเภทอื่นๆ</h2>
        <div class="form-group"><label>น้ำเสีย</label><input type="number" step="0.01" min="0" name="wasteWater" placeholder="0.00"></div>
        <div class="form-group" style="margin-bottom: 0;"><label>ขยะทั่วไป (ฝังกลบ)</label><input type="number" step="0.01" min="0" name="generalWaste" placeholder="0.00"></div>
      </section>

      <section class="form-section">
        <div class="summary-box" style="margin-top: 0;">
          <span>ปริมาณรวมทั้งหมด:</span>
          <strong id="totalWasteDisplay">0.00</strong> กิโลกรัม
        </div>
      </section>
      <!-- สิ้นสุด: ปริมาณขยะ -->

      <!-- เพิ่มพาร์ทปลายทางขยะ ตรงนี้ครับ -->
      <section class="form-section">
        <h2>ปลายทางขยะ</h2>
        
        <div style="margin-bottom: 20px;">
          <h4 style="margin-bottom: 10px; font-size: 16px; color: #475569;">--- ระบบบำบัด ---</h4>
          <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 15px; cursor: pointer;">
            <input type="checkbox" id="destTreatment" name="destTreatment" style="width: 20px; height: 20px; margin: 0;">
            ส่งเข้าระบบบำบัด (น้ำเสีย)
          </label>
        </div>

        <div style="margin-bottom: 0;">
          <h4 style="margin-bottom: 10px; font-size: 16px; color: #475569;">--- เทศบาล ---</h4>
          <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 15px; cursor: pointer;">
            <input type="checkbox" id="destLandfill" name="destLandfill" style="width: 20px; height: 20px; margin: 0;">
            (ไปหลุมฝังกลบ)
          </label>
        </div>
      </section>

      <section class="form-section">
        <h2 id="titleSectionFeedback">ข้อเสนอแนะ / แจ้งปัญหา</h2>
        <div class="form-group">
          <textarea id="feedback" name="feedback" rows="3" placeholder="ระบุคำแนะนำ หรือแจ้งปัญหาที่พบ..."></textarea>
        </div>
      </section>

      <button type="submit" class="submit-btn" id="submitBtn">ส่งข้อมูลเข้าสู่ระบบ</button>
    </form>
  </div>

  <div id="successPopup" class="popup-overlay" style="display: none;">
    <div class="popup-content">
      <div class="popup-icon">✓</div>
      <h3>ส่งข้อมูลเรียบร้อย</h3>
      <p>ขอบคุณค่ะ</p>
      <button id="closePopupBtn" class="popup-close-btn">ตกลง</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
